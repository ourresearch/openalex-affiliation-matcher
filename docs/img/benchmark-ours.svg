<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" width="440" height="330" role="img" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' style="font-variant-numeric: tabular-nums">
<title>Our benchmark, 3,000 random OpenAlex strings: exact match, 2023 system 72.7%, new matcher 89.4%, ROR's matcher 63.3%</title>
