<text x="36.0" y="190.0" fill="#707a84" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="middle">50%</text>
<line x1="44.0" y1="137.0" x2="432.0" y2="137.0" stroke="#8b949e" stroke-width="1" stroke-opacity="0.35"/>
<text x="36.0" y="137.0" fill="#707a84" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="middle">75%</text>
<line x1="44.0" y1="84.0" x2="432.0" y2="84.0" stroke="#8b949e" stroke-width="1" stroke-opacity="0.35"/>
<text x="36.0" y="84.0" fill="#707a84" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="middle">100%</text>
<path d="M72.7,296.0 V145.9 Q72.7,141.9 76.7,141.9 H140.7 Q144.7,141.9 144.7,145.9 V296.0 Z" fill="#888780"/>
